name: Firmware tooling tests

on:
  push:
    branches:
      - codex/hybrid-server-work
  pull_request:
    branches:
      - codex/hybrid-server-work

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install firmware test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools qemu-user
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
