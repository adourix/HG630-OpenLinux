name: Firmware inspection tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI syntax
        run: python -m py_compile tools/firmware_inspect.py
