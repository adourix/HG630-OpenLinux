# Runtime monitor remains isolated; network services are not implemented here.
NETWORK_MODE=disabled
NETWORK_BIND_ADDRESS=127.0.0.1
STARTUP_MODE=operator
MONITOR_INTERVAL_SECONDS=30

# Optional SSH. Disabled by default; start refuses unknown account/PTY/key state.
SSH_ENABLE=disabled
SSH_USER=openlinux
SSH_HOME=
SSH_STATE_DIR=
SSH_BIND_ADDRESS=
SSH_PORT=2222
